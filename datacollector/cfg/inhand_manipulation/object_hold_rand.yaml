task: 'myoHandObjHoldRandomCustom'

# data
save_path: "../data/inhand_mani/"
name: 'object_hold_val'
data_type: 'fingertip_pos' # 'fingtip_pos': [5,3], 'fingtip_pose': [5,7]
obj_data_type: 'obj_pos' # 'object_pose': [7], 'object_pos': [3]
num_data: 1000 # target data quantity to collect
episode_length: 50
# collector params
interval: 1
action_steps: 1
policy_path: 'logs/in-hand_manipulation/myoHandObjHoldRandomCustom/sac_model_myoHandObjHoldRandomCustom_3.zip'
vec_norm_path: 'logs/in-hand_manipulation/myoHandObjHoldRandomCustom/sac_env_myoHandObjHoldRandomCustom_3'

# biological or mechanical phenomena
ctrl_args:
  ctrl_decay: 0.  # decay coefficient of control signal, imitating Muscle Fatigue or Sarcopenia, bewteen 0 and 1
  broken_dim: -1  # set the dims to 0, imitation actuator broken, ofen use 2,3,4 dim

# device
device: "cpu"  # the device where we create envs and collect data