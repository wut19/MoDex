task: MyoHand
collector: SeqMyoHandDataCollector

# data
save_path: "../data/hand_data/"
name: 'myohand_sequence_train'
data_type: 'fingertip_pos' # 'fingtip_pos': [5,3], 'fingtip_pose': [5,7]
num_data: 100000 # target data quantity to collect
episode_length: 50
# collector params
interval: 1
action_steps: 10

# biological or mechanical phenomena
ctrl_args:
  ctrl_decay: 0.  # decay coefficient of control signal, imitating Muscle Fatigue or Sarcopenia, bewteen 0 and 1
  broken_dim: -1  # set the dims to 0, imitation actuator broken, ofen use 2,3,4 dim

# device
device: "cpu"  # the device where we create envs and collect data