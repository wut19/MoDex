###### network cfgs
use_handmodel: True
sizes: {
  'hand_state': 15,
  'obj_state': 6,
  'action': 39
}
hidden_sizes: {
  'hand_model': [256,256,256,256],
  'external_model': [512, 512],
}
hand_model_path: 'logs/models/myohand_seq_forward_model_inhand_Aug_22_02:16:47_2024/ckpt-1.pt'
#####################

###### run cfgs
exp_name: 'reorientation_hand'
log_path: 'inhand_logs/'
#####################

###### train cfgs
batch_size: 64
num_workers: 4
epochs: 50
do_validation: True

optimizer: 'Adam' # 'SGD' or 'Adam'
lr: 1e-4
beta1: 0.9
weight_decay: 0.01

# scheduler: 'Adaptive' # 'Linear' or 'Adaptive'
# # Linear
# step_size: 10
# gamma: 0.8
# # Adaptive
# mode: 'min'
# factor: 0.8
# threshold: 1e-8
# patience: 3
# verbose:  True
#####################

device: 'cuda:0'

