###### network cfgs
pred_type: 'position_seq' # 'position' or 'pose'
input_size: 54   # action dim + state dim (39+15)
output_size: 15  # states dim: 15 for position, 35 for pose
hidden_sizes: [256, 256, 256, 256]
normalization: True
#####################

###### run cfgs
exp_name: 'myohand_seq_forward_model_inhand'
log_path: 'logs/models'
#####################

###### train cfgs
train_path: 'data/hand_data/MyoHand/myohand_inhand_Aug_22_01:13:43_2024'    # train dataset path
val_path: 'data/hand_data/MyoHand/myohand_inhand_val_Aug_22_01:16:33_2024'        # validation dataset path
batch_size: 64
num_workers: 4
epochs: 100
save_interval: 5
do_validation: True

optimizer: 'Adam' # 'SGD' or 'Adam'
lr: 1e-4
beta1: 0.9

scheduler: 'Adaptive' # 'Linear' or 'Adaptive'
# Linear
step_size: 10
gamma: 0.8
# Adaptive
mode: 'min'
factor: 0.8
threshold: 1e-8
patience: 3
verbose:  True
#####################

device: 'cuda:0'

