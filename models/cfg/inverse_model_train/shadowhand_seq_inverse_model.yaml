###### network cfgs
pred_type: 'inverse_seq' # 'position' or 'pose'
input_size: 30   # fingertip poses dim: 30 for position, 70 for pose
output_size: 20 # action dim
hidden_sizes: [256, 256, 256, 256]
normalization: False
#####################

###### run cfgs
exp_name: 'shadowhand_seq_inverse_model'
log_path: 'logs/models'
#####################

###### train cfgs
train_path: 'data/hand_data/ShadowHand/SeqShadowHand_random_train_Jul_31_14:53:51_2024'    # train dataset path
val_path: 'data/hand_data/ShadowHand/SeqShadowHand_random_val_Jul_31_14:54:46_2024'        # validation dataset path
batch_size: 64
num_workers: 4
epochs: 100
save_interval: 5
do_validation: True

optimizer: 'Adam' # 'SGD' or 'Adam'
lr: 1e-3
beta1: 0.9

scheduler: 'Adaptive' # 'Linear' or 'Adaptive'
# Linear
step_size: 10
gamma: 0.8
# Adaptive
mode: 'min'
factor: 0.8
threshold: 1e-6
patience: 3
verbose:  True
#####################

device: 'cuda:0'

